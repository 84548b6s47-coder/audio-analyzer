<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio Analyzer</title>

  <style>
    body {
      margin: 0;
      background: #0b0f14;
      color: #f5f7fa;
      font-family: Arial, sans-serif;
    }

    .app {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    .panel {
      background: #111820;
      border: 1px solid #26313d;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }

    .spectrum {
      height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7f8b99;
      font-size: 18px;
    }

    input[type="file"] {
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <div class="app">
    <h1>Professional Audio Analyzer</h1>

    <div class="panel">
      <strong>Load audio file</strong><br />
      <input id="audioFile" type="file" accept=".wav,.mp3,audio/*" />
    </div>

    <div class="panel spectrum">
      Spectrum Analyzer
    </div>
  </div>

  <script>
    const audioFile = document.getElementById("audioFile");

    audioFile.addEventListener("change", () => {
      const file = audioFile.files[0];

      if (!file) return;

      console.log("Loaded:", file.name);
      alert("Loaded: " + file.name);
    });
  </script>
</body>
</html>
