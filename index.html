<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Professional Audio Analyzer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0f14;
      color: #f5f7fa;
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: min(1500px, 100%);
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 28px;
    }

    .panel {
      background: #111820;
      border: 1px solid #26313d;
      border-radius: 10px;
      padding: 16px;
      margin-top: 16px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    button {
      background: #1b2733;
      color: #ffffff;
      border: 1px solid #344556;
      border-radius: 7px;
      padding: 9px 14px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    input[type="range"] {
      accent-color: #d8ff4f;
    }

    .volume {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .volume input {
      width: 150px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .metric {
      background: #0b1118;
      border: 1px solid #202b35;
      border-radius: 8px;
      padding: 10px;
    }

    .metric-label {
      color: #7f8e9c;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .metric-value {
      font-size: 17px;
      font-weight: 700;
    }

    .status {
      margin-top: 12px;
      color: #91a0ae;
      font-size: 13px;
    }

    .validation {
      margin-top: 12px;
      padding: 12px;
      background: #0b1118;
      border: 1px solid #202b35;
      border-radius: 8px;
      color: #9cacba;
      font-size: 13px;
      line-height: 1.75;
    }

    .validation:empty {
      display: none;
    }

    .validation-title {
      color: #ffffff;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .pass {
      color: #b9f66e;
      font-weight: 700;
    }

    .fail {
      color: #ff7c7c;
      font-weight: 700;
    }

    .info {
      color: #ffd166;
    }

    canvas {
      width: 100%;
      height: 520px;
      display: block;
      background: #070b10;
      border-radius: 8px;
    }

    .transport {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }

    #seekSlider {
      flex: 1;
    }

    #timeDisplay {
      min-width: 110px;
      text-align: right;
      color: #aab6c2;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Professional Audio Analyzer</h1>

  <div class="panel">

    <div class="controls">

      <input
        id="audioFile"
        type="file"
        accept=".wav,.mp3,audio/*"
      />

      <button id="playButton" disabled>
        Play
      </button>

      <button id="pauseButton" disabled>
        Pause
      </button>

      <button id="muteButton" disabled>
        Mute
      </button>

      <div class="volume">
        <span>Volume</span>

        <input
          id="volumeSlider"
          type="range"
          min="0"
          max="1"
          value="1"
          step="0.01"
          disabled
        />

        <strong id="volumeValue">
          100%
        </strong>
      </div>

    </div>

    <div class="metrics">

      <div class="metric">
        <div class="metric-label">Source Sample Rate</div>
        <div class="metric-value" id="sourceSampleRate">-</div>
      </div>

      <div class="metric">
        <div class="metric-label">Channels</div>
        <div class="metric-value" id="channels">-</div>
      </div>

      <div class="metric">
        <div class="metric-label">Analysis Window</div>
        <div class="metric-value">32768</div>
      </div>

      <div class="metric">
        <div class="metric-label">FFT Transform</div>
        <div class="metric-value">131072</div>
      </div>

      <div class="metric">
        <div class="metric-label">Nyquist</div>
        <div class="metric-value" id="nyquist">-</div>
      </div>

      <div class="metric">
        <div class="metric-label">Duration</div>
        <div class="metric-value" id="duration">-</div>
      </div>

      <div class="metric">
        <div class="metric-label">Peak L</div>
        <div class="metric-value" id="peakL">-</div>
      </div>

      <div class="metric">
        <div class="metric-label">Peak R</div>
        <div class="metric-value" id="peakR">-</div>
      </div>

      <div class="metric">
        <div class="metric-label">RMS L</div>
        <div class="metric-value" id="rmsL">-</div>
      </div>

      <div class="metric">
        <div class="metric-label">RMS R</div>
        <div class="metric-value" id="rmsR">-</div>
      </div>

      <div class="metric">
        <div class="metric-label">Spectrum Peak</div>
        <div class="metric-value" id="spectrumPeak">-</div>
      </div>

    </div>

    <div class="status" id="status">
      Load a WAV or MP3 file.
    </div>

    <div class="validation" id="validation"></div>

  </div>


  <div class="panel">

    <canvas
      id="spectrumCanvas"
      width="1400"
      height="520"
    ></canvas>

    <div class="transport">

      <input
        id="seekSlider"
        type="range"
        min="0"
        max="1"
        value="0"
        step="0.001"
        disabled
      />

      <div id="timeDisplay">
        0:00 / 0:00
      </div>

    </div>

  </div>

</div>


<audio id="audioPlayer"></audio>


<script>

const WINDOW_SIZE = 32768;

const FFT_SIZE =
  WINDOW_SIZE * 4;

const MIN_FREQ = 20;
const MAX_FREQ = 20000;

const DISPLAY_MIN_DB = -100;
const DISPLAY_MAX_DB = 0;

const SWEEP_START_FREQ = 20;
const SWEEP_END_FREQ = 20000;


const fileInput =
  document.getElementById("audioFile");

const player =
  document.getElementById("audioPlayer");

const playButton =
  document.getElementById("playButton");

const pauseButton =
  document.getElementById("pauseButton");

const muteButton =
  document.getElementById("muteButton");

const volumeSlider =
  document.getElementById("volumeSlider");

const volumeValue =
  document.getElementById("volumeValue");

const seekSlider =
  document.getElementById("seekSlider");

const timeDisplay =
  document.getElementById("timeDisplay");

const statusEl =
  document.getElementById("status");

const validationEl =
  document.getElementById("validation");

const sourceSampleRateEl =
  document.getElementById("sourceSampleRate");

const channelsEl =
  document.getElementById("channels");

const nyquistEl =
  document.getElementById("nyquist");

const durationEl =
  document.getElementById("duration");

const peakLEl =
  document.getElementById("peakL");

const peakREl =
  document.getElementById("peakR");

const rmsLEl =
  document.getElementById("rmsL");

const rmsREl =
  document.getElementById("rmsR");

const spectrumPeakEl =
  document.getElementById("spectrumPeak");

const canvas =
  document.getElementById("spectrumCanvas");

const ctx =
  canvas.getContext("2d");


let currentObjectUrl = null;

let sampleRate = 0;
let channelData = [];
let monoData = null;

let duration = 0;

let muted = false;

let measuredPeakLeft = null;
let measuredRmsLeft = null;

let lastSpectrumResult = null;
let lastSpectrumUpdate = 0;



function linearToDb(value) {

  if (
    !Number.isFinite(value) ||
    value <= 0
  ) {
    return -Infinity;
  }

  return 20 * Math.log10(value);
}



function formatDb(value) {

  if (
    !Number.isFinite(value)
  ) {
    return "-∞ dBFS";
  }

  return `${value.toFixed(2)} dBFS`;
}



function formatTime(seconds) {

  if (
    !Number.isFinite(seconds)
  ) {
    return "0:00";
  }

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    Math.floor(seconds % 60);

  return (
    minutes +
    ":" +
    secs
      .toString()
      .padStart(2, "0")
  );
}



function freqToX(freq) {

  const minLog =
    Math.log10(MIN_FREQ);

  const maxLog =
    Math.log10(MAX_FREQ);

  const normalized =
    (
      Math.log10(freq) -
      minLog
    ) /
    (
      maxLog -
      minLog
    );

  return normalized * canvas.width;
}



function dbToY(db) {

  const clamped =
    Math.max(
      DISPLAY_MIN_DB,
      Math.min(
        DISPLAY_MAX_DB,
        db
      )
    );

  const normalized =
    (
      clamped -
      DISPLAY_MIN_DB
    ) /
    (
      DISPLAY_MAX_DB -
      DISPLAY_MIN_DB
    );

  return (
    canvas.height -
    normalized *
    canvas.height
  );
}



function drawGrid() {

  const width =
    canvas.width;

  const height =
    canvas.height;

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  ctx.fillStyle =
    "#070b10";

  ctx.fillRect(
    0,
    0,
    width,
    height
  );


  const frequencies = [

    20,
    30,
    50,
    100,
    200,
    500,
    1000,
    2000,
    5000,
    10000,
    20000

  ];


  ctx.font =
    "12px Arial";

  ctx.textAlign =
    "center";


  for (
    const freq
    of frequencies
  ) {

    const x =
      freqToX(freq);

    ctx.strokeStyle =
      "#1a2530";

    ctx.lineWidth = 1;

    ctx.beginPath();

    ctx.moveTo(
      x,
      0
    );

    ctx.lineTo(
      x,
      height
    );

    ctx.stroke();


    ctx.fillStyle =
      "#778795";


    const label =
      freq >= 1000
        ? `${freq / 1000}k`
        : `${freq}`;


    ctx.fillText(
      label,
      x,
      height - 7
    );

  }


  const dbMarks = [

    0,
    -12,
    -24,
    -36,
    -48,
    -60,
    -72,
    -84,
    -96

  ];


  ctx.textAlign =
    "left";


  for (
    const db
    of dbMarks
  ) {

    const y =
      dbToY(db);

    ctx.strokeStyle =
      "#15202a";

    ctx.beginPath();

    ctx.moveTo(
      0,
      y
    );

    ctx.lineTo(
      width,
      y
    );

    ctx.stroke();


    ctx.fillStyle =
      "#677887";

    ctx.fillText(
      `${db} dB`,
      6,
      Math.max(
        12,
        y - 4
      )
    );

  }

}



function calculatePeak(samples) {

  let peak = 0;

  for (
    let i = 0;
    i < samples.length;
    i++
  ) {

    const value =
      Math.abs(
        samples[i]
      );

    if (
      value > peak
    ) {
      peak = value;
    }

  }

  return peak;
}



function calculateRms(samples) {

  if (
    samples.length === 0
  ) {
    return 0;
  }

  let sum = 0;

  for (
    let i = 0;
    i < samples.length;
    i++
  ) {

    const value =
      samples[i];

    sum +=
      value *
      value;

  }

  return Math.sqrt(
    sum /
    samples.length
  );
}



function buildMono() {

  if (
    channelData.length === 0
  ) {
    return null;
  }

  const length =
    channelData[0].length;

  const output =
    new Float32Array(
      length
    );


  if (
    channelData.length === 1
  ) {

    output.set(
      channelData[0]
    );

    return output;
  }


  for (
    let i = 0;
    i < length;
    i++
  ) {

    output[i] =
      0.5 *
      (
        channelData[0][i] +
        channelData[1][i]
      );

  }

  return output;
}



function parseWav(arrayBuffer) {

  const view =
    new DataView(
      arrayBuffer
    );


  function readString(
    offset,
    length
  ) {

    let result = "";

    for (
      let i = 0;
      i < length;
      i++
    ) {

      result +=
        String.fromCharCode(
          view.getUint8(
            offset + i
          )
        );
    }

    return result;
  }


  if (
    readString(
      0,
      4
    ) !== "RIFF" ||

    readString(
      8,
      4
    ) !== "WAVE"
  ) {

    throw new Error(
      "Not a standard RIFF/WAVE file."
    );
  }


  let offset = 12;

  let audioFormat = null;
  let numChannels = null;
  let wavSampleRate = null;
  let bitsPerSample = null;

  let dataOffset = null;
  let dataSize = null;


  while (
    offset + 8 <=
    view.byteLength
  ) {

    const chunkId =
      readString(
        offset,
        4
      );

    const chunkSize =
      view.getUint32(
        offset + 4,
        true
      );

    const chunkDataOffset =
      offset + 8;


    if (
      chunkId === "fmt "
    ) {

      audioFormat =
        view.getUint16(
          chunkDataOffset,
          true
        );

      numChannels =
        view.getUint16(
          chunkDataOffset + 2,
          true
        );

      wavSampleRate =
        view.getUint32(
          chunkDataOffset + 4,
          true
        );

      bitsPerSample =
        view.getUint16(
          chunkDataOffset + 14,
          true
        );
    }


    if (
      chunkId === "data"
    ) {

      dataOffset =
        chunkDataOffset;

      dataSize =
        chunkSize;

      break;
    }


    offset =
      chunkDataOffset +
      chunkSize +
      (
        chunkSize % 2
      );
  }


  if (
    dataOffset === null ||
    audioFormat === null
  ) {

    throw new Error(
      "Invalid WAV structure."
    );
  }


  const bytesPerSample =
    bitsPerSample / 8;

  const frameSize =
    bytesPerSample *
    numChannels;

  const frameCount =
    Math.floor(
      dataSize /
      frameSize
    );


  const channels =
    Array.from(
      {
        length:
          numChannels
      },
      () =>
        new Float32Array(
          frameCount
        )
    );


  function readSample(position) {

    if (
      audioFormat === 3 &&
      bitsPerSample === 32
    ) {

      return view.getFloat32(
        position,
        true
      );
    }


    if (
      audioFormat !== 1
    ) {

      throw new Error(
        `Unsupported WAV format: ${audioFormat}`
      );
    }


    if (
      bitsPerSample === 8
    ) {

      return (
        view.getUint8(
          position
        ) -
        128
      ) / 128;
    }


    if (
      bitsPerSample === 16
    ) {

      return (
        view.getInt16(
          position,
          true
        ) /
        32768
      );
    }


    if (
      bitsPerSample === 24
    ) {

      let value =
        view.getUint8(
          position
        ) |

        (
          view.getUint8(
            position + 1
          ) <<
          8
        ) |

        (
          view.getUint8(
            position + 2
          ) <<
          16
        );


      if (
        value &
        0x800000
      ) {

        value |=
          0xff000000;
      }


      return (
        value /
        8388608
      );
    }


    if (
      bitsPerSample === 32
    ) {

      return (
        view.getInt32(
          position,
          true
        ) /
        2147483648
      );
    }


    throw new Error(
      `Unsupported WAV bit depth: ${bitsPerSample}`
    );
  }


  let position =
    dataOffset;


  for (
    let frame = 0;
    frame < frameCount;
    frame++
  ) {

    for (
      let channel = 0;
      channel < numChannels;
      channel++
    ) {

      channels[
        channel
      ][
        frame
      ] =
        readSample(
          position
        );

      position +=
        bytesPerSample;
    }
  }


  return {

    sampleRate:
      wavSampleRate,

    channels:
      channels,

    frameCount:
      frameCount,

    bitsPerSample:
      bitsPerSample

  };
}



async function decodeWithBrowser(
  arrayBuffer
) {

  const context =
    new AudioContext();

  try {

    const decoded =
      await context.decodeAudioData(
        arrayBuffer.slice(0)
      );

    const channels = [];

    for (
      let i = 0;
      i <
      decoded.numberOfChannels;
      i++
    ) {

      channels.push(
        new Float32Array(
          decoded.getChannelData(i)
        )
      );
    }


    return {

      sampleRate:
        decoded.sampleRate,

      channels:
        channels,

      frameCount:
        decoded.length,

      browserDecoded:
        true
    };

  }

  finally {

    await context.close();
  }
}



function bitReverse(
  real,
  imag
) {

  const n =
    real.length;

  let j = 0;


  for (
    let i = 1;
    i < n;
    i++
  ) {

    let bit =
      n >> 1;


    while (
      j & bit
    ) {

      j ^=
        bit;

      bit >>=
        1;
    }


    j ^=
      bit;


    if (
      i < j
    ) {

      let temp =
        real[i];

      real[i] =
        real[j];

      real[j] =
        temp;


      temp =
        imag[i];

      imag[i] =
        imag[j];

      imag[j] =
        temp;
    }
  }
}



function fft(
  real,
  imag
) {

  const n =
    real.length;

  bitReverse(
    real,
    imag
  );


  for (
    let length = 2;
    length <= n;
    length <<= 1
  ) {

    const half =
      length >> 1;

    const angle =
      -2 *
      Math.PI /
      length;

    const wLengthReal =
      Math.cos(
        angle
      );

    const wLengthImag =
      Math.sin(
        angle
      );


    for (
      let start = 0;
      start < n;
      start += length
    ) {

      let wReal = 1;
      let wImag = 0;


      for (
        let j = 0;
        j < half;
        j++
      ) {

        const even =
          start + j;

        const odd =
          even + half;


        const oddReal =
          real[odd] *
          wReal -
          imag[odd] *
          wImag;


        const oddImag =
          real[odd] *
          wImag +
          imag[odd] *
          wReal;


        const evenReal =
          real[even];

        const evenImag =
          imag[even];


        real[even] =
          evenReal +
          oddReal;

        imag[even] =
          evenImag +
          oddImag;

        real[odd] =
          evenReal -
          oddReal;

        imag[odd] =
          evenImag -
          oddImag;


        const nextWReal =
          wReal *
          wLengthReal -
          wImag *
          wLengthImag;


        const nextWImag =
          wReal *
          wLengthImag +
          wImag *
          wLengthReal;


        wReal =
          nextWReal;

        wImag =
          nextWImag;
      }
    }
  }
}



function calculateSpectrum(
  centerTime
) {

  if (
    !monoData ||
    !sampleRate
  ) {

    return null;
  }


  const maxStart =
    Math.max(
      0,
      monoData.length -
      WINDOW_SIZE
    );


  const requestedStart =
    Math.floor(
      centerTime *
      sampleRate -
      WINDOW_SIZE /
      2
    );


  const startSample =
    Math.max(
      0,
      Math.min(
        maxStart,
        requestedStart
      )
    );


  const effectiveCenterTime =
    (
      startSample +
      WINDOW_SIZE / 2
    ) /
    sampleRate;


  const real =
    new Float64Array(
      FFT_SIZE
    );

  const imag =
    new Float64Array(
      FFT_SIZE
    );


  let windowSum = 0;


  for (
    let i = 0;
    i < WINDOW_SIZE;
    i++
  ) {

    const window =
      0.5 -
      0.5 *
      Math.cos(
        2 *
        Math.PI *
        i /
        (
          WINDOW_SIZE -
          1
        )
      );


    windowSum +=
      window;


    const sampleIndex =
      startSample +
      i;


    const sample =
      sampleIndex <
      monoData.length
        ? monoData[
            sampleIndex
          ]
        : 0;


    real[i] =
      sample *
      window;
  }


  fft(
    real,
    imag
  );


  const half =
    FFT_SIZE / 2;


  const frequencies =
    new Float64Array(
      half
    );


  const dbValues =
    new Float64Array(
      half
    );


  let peakDb =
    -Infinity;

  let peakFrequency =
    0;

  let peakBin =
    0;


  for (
    let k = 1;
    k < half;
    k++
  ) {

    const frequency =
      k *
      sampleRate /
      FFT_SIZE;


    const magnitude =
      Math.sqrt(
        real[k] *
        real[k] +
        imag[k] *
        imag[k]
      );


    const amplitude =
      2 *
      magnitude /
      windowSum;


    const db =
      linearToDb(
        amplitude
      );


    frequencies[k] =
      frequency;

    dbValues[k] =
      db;


    if (
      Number.isFinite(db) &&
      db > peakDb &&
      frequency >= MIN_FREQ &&
      frequency <= MAX_FREQ
    ) {

      peakDb =
        db;

      peakFrequency =
        frequency;

      peakBin =
        k;
    }
  }


  if (
    peakBin > 1 &&
    peakBin <
    half - 1
  ) {

    const y1 =
      dbValues[
        peakBin - 1
      ];

    const y2 =
      dbValues[
        peakBin
      ];

    const y3 =
      dbValues[
        peakBin + 1
      ];


    if (
      Number.isFinite(y1) &&
      Number.isFinite(y2) &&
      Number.isFinite(y3)
    ) {

      const denominator =
        y1 -
        2 * y2 +
        y3;


      if (
        Math.abs(
          denominator
        ) >
        1e-12
      ) {

        const delta =
          0.5 *
          (
            y1 -
            y3
          ) /
          denominator;


        peakFrequency =
          (
            peakBin +
            delta
          ) *
          sampleRate /
          FFT_SIZE;


        peakDb =
          y2 -
          0.25 *
          (
            y1 -
            y3
          ) *
          delta;
      }
    }
  }


  return {

    frequencies,
    dbValues,

    peakDb,
    peakFrequency,

    effectiveCenterTime
  };
}



function drawSpectrum(
  spectrum
) {

  drawGrid();


  if (
    !spectrum
  ) {
    return;
  }


  const width =
    canvas.width;


  const pixelMax =
    new Float64Array(
      width
    );


  pixelMax.fill(
    -Infinity
  );


  for (
    let i = 1;
    i <
    spectrum.frequencies.length;
    i++
  ) {

    const frequency =
      spectrum.frequencies[i];


    if (
      frequency <
      MIN_FREQ
    ) {
      continue;
    }


    if (
      frequency >
      MAX_FREQ
    ) {
      break;
    }


    const db =
      spectrum.dbValues[i];


    if (
      !Number.isFinite(db)
    ) {
      continue;
    }


    const x =
      Math.floor(
        freqToX(
          frequency
        )
      );


    if (
      x >= 0 &&
      x < width &&
      db >
      pixelMax[x]
    ) {

      pixelMax[x] =
        db;
    }
  }


  ctx.strokeStyle =
    "#d8ff4f";

  ctx.lineWidth = 2;

  ctx.beginPath();


  let started = false;

  let lastValidDb =
    DISPLAY_MIN_DB;


  for (
    let x = 0;
    x < width;
    x++
  ) {

    let db =
      pixelMax[x];


    if (
      !Number.isFinite(db)
    ) {

      db =
        lastValidDb;
    }

    else {

      lastValidDb =
        db;
    }


    const y =
      dbToY(db);


    if (
      !started
    ) {

      ctx.moveTo(
        x,
        y
      );

      started = true;
    }

    else {

      ctx.lineTo(
        x,
        y
      );
    }
  }


  ctx.stroke();


  spectrumPeakEl.textContent =
    `${spectrum.peakFrequency.toFixed(2)} Hz / ${spectrum.peakDb.toFixed(2)} dBFS`;
}



function estimateSweepFrequencyFromZeroCrossings(
  time
) {

  if (
    !monoData ||
    !sampleRate
  ) {

    return null;
  }


  const center =
    Math.floor(
      time *
      sampleRate
    );


  const searchRadius =
    Math.floor(
      sampleRate *
      0.35
    );


  const start =
    Math.max(
      1,
      center -
      searchRadius
    );


  const end =
    Math.min(
      monoData.length - 1,
      center +
      searchRadius
    );


  const crossings = [];


  for (
    let i = start;
    i < end;
    i++
  ) {

    const previous =
      monoData[i - 1];

    const current =
      monoData[i];


    if (
      previous <= 0 &&
      current > 0
    ) {

      const denominator =
        current -
        previous;


      let fraction = 0;


      if (
        Math.abs(
          denominator
        ) >
        1e-12
      ) {

        fraction =
          -previous /
          denominator;
      }


      crossings.push(
        i -
        1 +
        fraction
      );
    }
  }


  if (
    crossings.length < 3
  ) {

    return null;
  }


  let nearestIndex = 0;

  let nearestDistance =
    Infinity;


  for (
    let i = 0;
    i < crossings.length;
    i++
  ) {

    const distance =
      Math.abs(
        crossings[i] -
        center
      );


    if (
      distance <
      nearestDistance
    ) {

      nearestDistance =
        distance;

      nearestIndex =
        i;
    }
  }


  const periods = [];


  const first =
    Math.max(
      1,
      nearestIndex - 2
    );


  const last =
    Math.min(
      crossings.length - 1,
      nearestIndex + 2
    );


  for (
    let i = first;
    i <= last;
    i++
  ) {

    const period =
      crossings[i] -
      crossings[i - 1];


    if (
      period > 0
    ) {

      periods.push(
        period
      );
    }
  }


  if (
    periods.length === 0
  ) {

    return null;
  }


  periods.sort(
    (a, b) =>
      a - b
  );


  const median =
    periods[
      Math.floor(
        periods.length /
        2
      )
    ];


  if (
    !Number.isFinite(
      median
    ) ||
    median <= 0
  ) {

    return null;
  }


  return (
    sampleRate /
    median
  );
}



function expectedSweepFrequency(
  time
) {

  if (
    duration <= 0
  ) {

    return null;
  }


  const normalizedTime =
    Math.max(
      0,
      Math.min(
        1,
        time /
        duration
      )
    );


  return (
    SWEEP_START_FREQ *
    Math.pow(
      SWEEP_END_FREQ /
      SWEEP_START_FREQ,
      normalizedTime
    )
  );
}



function isSweepFile() {

  const filename =
    fileInput.files[0]
      ?.name
      ?.toLowerCase() ||
    "";


  return (
    filename.includes(
      "20hz_to_20khz"
    ) &&
    filename.includes(
      "sweep"
    )
  );
}



function getSteadyToneTest() {

  const filename =
    fileInput.files[0]
      ?.name
      ?.toLowerCase() ||
    "";


  if (
    filename.includes(
      "100hz_-18dbfs"
    )
  ) {

    return {
      frequency: 100,
      peak: -18,
      rms: -21.0103
    };
  }


  if (
    filename.includes(
      "1khz_-18dbfs"
    )
  ) {

    return {
      frequency: 1000,
      peak: -18,
      rms: -21.0103
    };
  }


  if (
    filename.includes(
      "10khz_-18dbfs"
    )
  ) {

    return {
      frequency: 10000,
      peak: -18,
      rms: -21.0103
    };
  }


  return null;
}



function passLabel(
  passed
) {

  return (
    `<span class="${passed ? "pass" : "fail"}">
      ${passed ? "PASS" : "FAIL"}
    </span>`
  );
}



function updateValidation() {

  if (
    measuredPeakLeft === null ||
    measuredRmsLeft === null ||
    !lastSpectrumResult
  ) {

    validationEl.innerHTML =
      "";

    return;
  }


  const steadyTest =
    getSteadyToneTest();


  if (
    steadyTest
  ) {

    const peakError =
      Math.abs(
        measuredPeakLeft -
        steadyTest.peak
      );


    const rmsError =
      Math.abs(
        measuredRmsLeft -
        steadyTest.rms
      );


    const frequencyError =
      Math.abs(
        lastSpectrumResult
          .peakFrequency -
        steadyTest.frequency
      );


    const spectrumError =
      Math.abs(
        lastSpectrumResult
          .peakDb -
        steadyTest.peak
      );


    validationEl.innerHTML =
      `
      <div class="validation-title">
        Calibration — ${steadyTest.frequency} Hz / -18 dBFS
      </div>

      Peak:
      expected ${steadyTest.peak.toFixed(3)} dBFS —
      measured ${measuredPeakLeft.toFixed(3)} dBFS —
      error ${peakError.toFixed(3)} dB —
      ${passLabel(
        peakError <= 0.05
      )}

      <br>

      RMS:
      expected ${steadyTest.rms.toFixed(3)} dBFS —
      measured ${measuredRmsLeft.toFixed(3)} dBFS —
      error ${rmsError.toFixed(3)} dB —
      ${passLabel(
        rmsError <= 0.05
      )}

      <br>

      Frequency:
      expected ${steadyTest.frequency.toFixed(3)} Hz —
      measured ${lastSpectrumResult.peakFrequency.toFixed(3)} Hz —
      error ${frequencyError.toFixed(3)} Hz —
      ${passLabel(
        frequencyError <=
        Math.max(
          1,
          steadyTest.frequency *
          0.001
        )
      )}

      <br>

      Spectrum amplitude:
      expected ${steadyTest.peak.toFixed(3)} dBFS —
      measured ${lastSpectrumResult.peakDb.toFixed(3)} dBFS —
      error ${spectrumError.toFixed(3)} dB —
      ${passLabel(
        spectrumError <= 0.10
      )}
      `;

    return;
  }


  if (
    isSweepFile()
  ) {

    const analysisTime =
      Math.max(
        0,
        Math.min(
          duration,
          player.currentTime
        )
      );


    const expected =
      expectedSweepFrequency(
        analysisTime
      );


    const measured =
      estimateSweepFrequencyFromZeroCrossings(
        analysisTime
      );


    if (
      !Number.isFinite(
        expected
      ) ||
      !Number.isFinite(
        measured
      )
    ) {

      validationEl.innerHTML =
        `
        <div class="validation-title">
          Log Sweep Validation
        </div>

        Measurement unavailable at this position.
        `;

      return;
    }


    const errorHz =
      Math.abs(
        measured -
        expected
      );


    const errorPercent =
      (
        errorHz /
        expected
      ) *
      100;


    const pass =
      errorPercent <= 2;


    validationEl.innerHTML =
      `
      <div class="validation-title">
        Log Sweep Tracking
      </div>

      Time:
      ${analysisTime.toFixed(3)} s

      <br>

      Expected frequency:
      <strong>${expected.toFixed(2)} Hz</strong>

      <br>

      Measured frequency:
      <strong>${measured.toFixed(2)} Hz</strong>

      <br>

      Error:
      ${errorHz.toFixed(2)} Hz
      (${errorPercent.toFixed(2)}%)

      —
      ${passLabel(pass)}

      <br>

      FFT peak currently displayed:
      ${lastSpectrumResult.peakFrequency.toFixed(2)} Hz

      <br>

      <span class="info">
        Sweep amplitude is not graded against -18 dBFS because
        a changing-frequency chirp spreads energy across multiple FFT bins.
      </span>
      `;

    return;
  }


  validationEl.innerHTML =
    "";
}



function updateSpectrumNow() {

  if (
    !monoData
  ) {

    return;
  }


  const spectrum =
    calculateSpectrum(
      player.currentTime
    );


  lastSpectrumResult =
    spectrum;


  drawSpectrum(
    spectrum
  );


  updateValidation();
}



function updateMeasurements() {

  if (
    channelData.length === 0
  ) {

    return;
  }


  const left =
    channelData[0];


  const right =
    channelData.length > 1
      ? channelData[1]
      : channelData[0];


  measuredPeakLeft =
    linearToDb(
      calculatePeak(
        left
      )
    );


  const measuredPeakRight =
    linearToDb(
      calculatePeak(
        right
      )
    );


  measuredRmsLeft =
    linearToDb(
      calculateRms(
        left
      )
    );


  const measuredRmsRight =
    linearToDb(
      calculateRms(
        right
      )
    );


  peakLEl.textContent =
    formatDb(
      measuredPeakLeft
    );


  peakREl.textContent =
    formatDb(
      measuredPeakRight
    );


  rmsLEl.textContent =
    formatDb(
      measuredRmsLeft
    );


  rmsREl.textContent =
    formatDb(
      measuredRmsRight
    );
}



async function loadFile(
  file
) {

  statusEl.className =
    "status";


  statusEl.textContent =
    "Reading audio data...";


  const arrayBuffer =
    await file.arrayBuffer();


  let decoded;


  if (
    file.name
      .toLowerCase()
      .endsWith(".wav")
  ) {

    try {

      decoded =
        parseWav(
          arrayBuffer
        );


      statusEl.textContent =
        "WAV decoded directly at source sample rate.";
    }

    catch (
      error
    ) {

      console.warn(
        error
      );


      decoded =
        await decodeWithBrowser(
          arrayBuffer
        );


      statusEl.textContent =
        "WAV decoded using browser fallback.";
    }
  }

  else {

    decoded =
      await decodeWithBrowser(
        arrayBuffer
      );


    statusEl.textContent =
      "Compressed audio decoded by browser.";
  }


  sampleRate =
    decoded.sampleRate;


  channelData =
    decoded.channels;


  monoData =
    buildMono();


  duration =
    decoded.frameCount /
    sampleRate;


  sourceSampleRateEl.textContent =
    `${sampleRate} Hz`;


  channelsEl.textContent =
    channelData.length;


  nyquistEl.textContent =
    `${(
      sampleRate /
      2
    ).toFixed(0)} Hz`;


  durationEl.textContent =
    `${duration.toFixed(2)} s`;


  seekSlider.max =
    duration;


  seekSlider.value =
    0;


  measuredPeakLeft =
    null;


  measuredRmsLeft =
    null;


  lastSpectrumResult =
    null;


  updateMeasurements();


  if (
    currentObjectUrl
  ) {

    URL.revokeObjectURL(
      currentObjectUrl
    );
  }


  currentObjectUrl =
    URL.createObjectURL(
      file
    );


  player.src =
    currentObjectUrl;


  player.volume =
    Number(
      volumeSlider.value
    );


  player.muted =
    false;


  muted =
    false;


  muteButton.textContent =
    "Mute";


  playButton.disabled =
    false;


  pauseButton.disabled =
    false;


  muteButton.disabled =
    false;


  volumeSlider.disabled =
    false;


  seekSlider.disabled =
    false;


  player.currentTime = 0;


  updateTime();


  updateSpectrumNow();
}



function updateTime() {

  timeDisplay.textContent =
    `${formatTime(
      player.currentTime
    )} / ${formatTime(
      duration
    )}`;
}



fileInput.addEventListener(
  "change",
  async () => {

    const file =
      fileInput.files[0];


    if (
      !file
    ) {

      return;
    }


    try {

      await loadFile(
        file
      );
    }

    catch (
      error
    ) {

      console.error(
        error
      );


      statusEl.textContent =
        `Analysis failed: ${error.message}`;


      statusEl.className =
        "status fail";
    }
  }
);



playButton.addEventListener(
  "click",
  async () => {

    try {

      await player.play();
    }

    catch (
      error
    ) {

      console.error(
        error
      );
    }
  }
);



pauseButton.addEventListener(
  "click",
  () => {

    player.pause();
  }
);



muteButton.addEventListener(
  "click",
  () => {

    muted =
      !muted;


    player.muted =
      muted;


    muteButton.textContent =
      muted
        ? "Unmute"
        : "Mute";
  }
);



volumeSlider.addEventListener(
  "input",
  () => {

    const value =
      Number(
        volumeSlider.value
      );


    player.volume =
      value;


    volumeValue.textContent =
      `${Math.round(
        value *
        100
      )}%`;
  }
);



seekSlider.addEventListener(
  "input",
  () => {

    player.currentTime =
      Number(
        seekSlider.value
      );


    updateTime();


    updateSpectrumNow();
  }
);



player.addEventListener(
  "timeupdate",
  () => {

    seekSlider.value =
      player.currentTime;


    updateTime();


    const now =
      performance.now();


    if (
      now -
      lastSpectrumUpdate >
      150
    ) {

      lastSpectrumUpdate =
        now;


      updateSpectrumNow();
    }
  }
);



player.addEventListener(
  "seeked",
  () => {

    updateSpectrumNow();
  }
);



player.addEventListener(
  "ended",
  () => {

    updateSpectrumNow();
  }
);



drawGrid();

</script>
